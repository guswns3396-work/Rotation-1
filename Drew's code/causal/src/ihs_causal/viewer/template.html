<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IHS causal results</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(42,120,214,0.08);
  --s1: #2a78d6; --note: #f3f1ea; --bad: #d03b3b;
  --pos: #2a78d6; --neg: #e34948; --mid: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(57,135,229,0.12);
    --s1: #3987e5; --note: #222220; --bad: #e66767;
    --pos: #3987e5; --neg: #e66767; --mid: #383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(57,135,229,0.12);
  --s1: #3987e5; --note: #222220; --bad: #e66767;
  --pos: #3987e5; --neg: #e66767; --mid: #383835;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
header { padding: 28px 0 4px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
.icon-btn, .btn { border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; padding: 7px 18px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.datanote { background: var(--note); color: var(--ink-2); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 10px 0 0; }
nav { display: flex; gap: 24px; border-bottom: 1px solid var(--grid); margin: 14px 0 24px; overflow-x: auto; }
nav button { border: 0; background: none; font: inherit; color: var(--muted); padding: 10px 0; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 20px 20px 12px; margin-bottom: 20px; }
.card h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
.card .note { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.sub3 { font-size: 14px; font-weight: 600; margin: 18px 0 2px; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0 12px; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: flex-end; }
.filters label, .field { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
select, input[type=text], input[type=number] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 6px; min-width: 110px; }
input[type=number] { width: 90px; min-width: 0; }
.checks { display: flex; gap: 12px; flex-wrap: wrap; color: var(--ink); font-size: 13px; }
.checks label { flex-direction: row; align-items: center; gap: 5px; color: var(--ink); font-size: 13px; display: inline-flex; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; margin: 10px 0 6px; }
.form-sec { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 16px 0 4px; }
svg text { font-family: inherit; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.rowlab { fill: var(--ink); font-size: 13px; }
.rowsub { fill: var(--muted); font-size: 11.5px; }
.grouplab { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.hit { fill: transparent; }
.hit:hover, .hit:focus { fill: var(--wash); outline: none; }
details { margin-top: 6px; }
summary { color: var(--muted); font-size: 12.5px; cursor: pointer; padding: 4px 0; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0 8px; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--grid); padding: 6px 8px 6px 0; white-space: nowrap; }
td { border-bottom: 1px solid var(--grid); padding: 5px 8px 5px 0; font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.legend { display: flex; gap: 18px; color: var(--ink-2); font-size: 12px; margin: 2px 0 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px;
       padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 340px; display: none; z-index: 10; }
#tip .v { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
#tip .l { color: var(--ink-2); }
#tip .m { color: var(--muted); margin-top: 4px; }
.prose { color: var(--ink-2); font-size: 14px; }
.prose > p, .prose > ul, p.prose { max-width: 78ch; }
.prose h3 { color: var(--ink); font-size: 14px; margin: 20px 0 4px; }
.prose ul { padding-left: 20px; margin: 4px 0; }
.prose li { margin: 3px 0; }
.job { border-top: 1px solid var(--grid); padding: 8px 0; font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.job .st { font-weight: 600; }
.job .st.failed { color: var(--bad); }
.job .log { grid-column: 1 / -1; color: var(--muted); font-size: 12px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
code { font-size: 12.5px; background: var(--wash); padding: 1px 4px; border-radius: 4px; }
.form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--wash); color: var(--ink); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; }
.chip button { border: 0; background: none; color: var(--ink-2); cursor: pointer; font: inherit; padding: 0 6px; border-radius: 999px; }
.chip button:hover { background: var(--ring); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.runbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.cov { color: var(--muted); font-size: 11.5px; }
.who-sec { border-left: 2px solid var(--grid); padding-left: 14px; margin-top: 8px; }
.who-sec[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
/* who responds: characteristic x message grid */
.hm { border-collapse: separate; border-spacing: 2px; width: auto; font-size: 12.5px; margin: 4px 0 8px; }
.hm th { color: var(--ink-2); font-weight: 500; border: 0; padding: 4px 6px; text-align: center; white-space: normal; vertical-align: bottom; max-width: 96px; line-height: 1.25; }
.hm th.rl { text-align: left; max-width: none; white-space: nowrap; font-weight: 400; color: var(--ink); cursor: pointer; }
.hm th.rl.sel, .hm th.cl.sel { color: var(--ink); font-weight: 600; }
.hm th.cl { cursor: pointer; }
.hm th.grp { text-align: left; color: var(--muted); font-size: 11.5px; font-weight: 600; padding-top: 10px; }
.hm td { border: 0; min-width: 64px; height: 30px; text-align: center; border-radius: 4px; padding: 0 6px; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.hm td.sig { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 600; }
.hm td.na { color: var(--muted); cursor: default; }
.hm td.eff { background: none; color: var(--ink-2); }
.hm td.eff.sig { color: var(--ink); }
.hm td:focus-visible, .hm th:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
.scalebar { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; margin: 4px 0 10px; flex-wrap: wrap; }
.scalebar .bar { width: 160px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in oklab, var(--neg) 60%, var(--mid)), var(--mid), color-mix(in oklab, var(--pos) 60%, var(--mid))); }
.sigkey { display: inline-block; width: 18px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--ink); vertical-align: -2px; }
/* setup page and standard analyses */
.bad { color: var(--bad); }
input.path { flex: 1 1 auto; min-width: 0; width: 100%; font-size: 14px; padding: 7px 9px; }
.setup-row { display: flex; gap: 10px; align-items: center; margin: 12px 0 6px; }
.setup-row .btn { white-space: nowrap; flex: none; }
.std-list { margin: 4px 0 12px; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>IHS messaging study: causal effects</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="controls" id="controls"></div>
  </header>
  <div id="datanote"></div>
  <nav role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="tip" role="tooltip"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
let DATA = JSON.parse(document.getElementById("data").textContent) || {estimates: [], runs: [], diagnostics: [], notes: {}, defaults: {}, mode: "static"};
let E = DATA.estimates;
const SERVE = DATA.mode === "serve";
const OUT = {mood: "Mood", steps: "Steps (log)", sleep: "Sleep (minutes)"};
const OUT_UNITS = {mood: "mood points", steps: "log steps", sleep: "minutes"};
const DEVICES = [["combined", "Combined"], ["apple", "Apple"], ["garmin", "Garmin"], ["fitbit", "Fitbit"]];
const DEVNAME = Object.fromEntries(DEVICES);
const QUESTIONS = [
  {q: "Q1", title: "Do messages change anything?", note: "Any delivered message against no message, in the day after the decision."},
  {q: "Q4", title: "Do messages move their own domain?", note: "Sleep messages on sleep, step messages on steps, mood messages on mood, each against no message."},
  {q: "Q5", title: "Do messages spill over into other domains?", note: "Messages of one domain on the other two outcomes, each against no message."},
  {q: "Q2", title: "Does the therapeutic strategy matter?", note: "Each strategy, within messages of the outcome's own domain, against no message."},
  {q: "Q3", title: "Does showing people their own data matter?", note: "Messages that display the participant's own data against the same kind of message without it."},
  {q: "Q6", title: "Who responds?", note: "Whether effects depend on context or baseline traits, and whether true effects differ between people."}
];
const MODNAME = {Mood_pre: "Mood the day before", log_steps_pre: "Steps the day before", sleep_minutes_pre: "Sleep the night before",
  t: "Days into the study", Age: "Age", Sex: "Sex", depr0: "Depression history", PHQtot0: "PHQ-9 at baseline", GADtot0: "GAD-7 at baseline",
  Neu0_published: "Neuroticism", SLE0: "Stressful life events", EFE0: "Early family environment"};
const CONTEXT_MODS = new Set(["Mood_pre", "log_steps_pre", "sleep_minutes_pre", "t", "Mood_sd_pre", "Mood_n_pre", "hr_avg_pre", "RHR_pre", "observed_hours_pre", "watch_share_pre"]);
const modName = k => MODNAME[k] || k;
const CONTRAST_NAME = {any_vs_none: "Any message vs none", domain_vs_none: "Message domains vs none", strategy_vs_none: "Strategies vs none",
  type_vs_none: "Message types vs none", data_vs_nodata: "Own data shown vs not", data_within_strategy: "Own data, within each strategy",
  type_any_vs_none: "Message types, any domain", strategy_pairwise: "Strategies against CS"};
const CONTRAST_ORDER = Object.keys(CONTRAST_NAME);
const isWho = r => r.family === "q6" || r.family === "q6-custom";
const state = {tab: "answers", cohort: 2025, device: "combined", apple: "watch_then_phone", scale: "std", ex: {}, rob: "", q2: "strategy", q6: "any", jobs: [], who: {}};
if (!E.some(r => r.cohort == 2025) && E.some(r => r.cohort == 2024)) state.cohort = 2024;
const SETUP = () => DATA.setup || {};
if (SERVE && SETUP().needed) state.tab = "setup";       // first start on this computer: choose the data folder

const BOOL_ATTRS = new Set(["checked", "disabled", "open", "selected"]);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (BOOL_ATTRS.has(k)) { if (v) n.setAttribute(k, ""); continue; } if (k === "class") n.className = v; else n.setAttribute(k, String(v)); } kids.flat().forEach(k => { if (k != null && k !== "") n.append(k instanceof Node ? k : document.createTextNode(String(k))); }); return n; };
const svgEl = (tag, attrs) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); return n; };
const fmt = (x, d = 2) => { if (x == null || !isFinite(x)) return "–"; const s = Number(x).toFixed(d); return +s === 0 ? Number(0).toFixed(d) : s; };
const fmtP = p => p == null ? "–" : p < 0.001 ? "<0.001" : p.toFixed(3);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const std = r => (r.sd_reference_outcome ? 1 / r.sd_reference_outcome : null);
const inView = r => r.cohort == state.cohort && r.device === state.device && (state.device !== "apple" || (r.apple_source || "watch_then_phone") === state.apple);
const order = ["mood", "steps", "sleep"];

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(ev, lines) {
  tip.replaceChildren(...lines.map(([cls, t]) => el("div", {class: cls}, t)));
  tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------- forest plot ----------
function niceStep(span) { const raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw); }
function forest(rows, opts) {
  const box = el("div", {class: "scroll"});
  if (!rows.length) { box.append(el("div", {class: "empty"}, opts.empty || "No estimates for this selection yet.")); return box; }
  const W = Math.max(560, Math.min(1000, (document.querySelector(".wrap").clientWidth || 1000) - 78));
  const left = Math.min(300, Math.round(W * 0.36)), right = 28, rowH = 30, groupH = 26, axisH = 46;
  const groups = []; rows.forEach(r => { if (!groups.length || groups[groups.length - 1].name !== r.group) groups.push({name: r.group, rows: []}); groups[groups.length - 1].rows.push(r); });
  const H = groups.reduce((h, g) => h + (g.name ? groupH : 0) + g.rows.length * rowH, 8) + axisH;
  const vals = rows.flatMap(r => [r.lo, r.hi, r.slo, r.shi, r.est]).filter(v => v != null && isFinite(v));
  let m = Math.max(...vals.map(Math.abs), 1e-9); const step = niceStep(2 * m); m = Math.ceil(m / step) * step;
  const x = v => left + (v + m) / (2 * m) * (W - left - right);
  const svg = svgEl("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.aria || "Forest plot of estimated effects"});
  for (let t = -m; t <= m + 1e-12; t += step) {
    svg.append(svgEl("line", {x1: x(t), x2: x(t), y1: 4, y2: H - axisH + 4, stroke: Math.abs(t) < 1e-12 ? "var(--axis)" : "var(--grid)", "stroke-width": 1}));
    const tx = svgEl("text", {x: x(t), y: H - axisH + 18, "text-anchor": "middle", class: "tick"}); tx.textContent = (Math.abs(t) < 1e-12 ? 0 : +t.toFixed(4)).toString(); svg.append(tx);
  }
  let y = 8;
  groups.forEach(g => {
    if (g.name) { const t = svgEl("text", {x: 0, y: y + 17, class: "grouplab"}); t.textContent = g.name; svg.append(t); y += groupH; }
    g.rows.forEach(r => {
      const cy = y + rowH / 2;
      const hit = svgEl("rect", {x: 0, y: y + 1, width: W, height: rowH - 2, rx: 6, class: "hit", tabindex: 0});
      const lab = svgEl("text", {x: 12, y: cy + (r.sub ? -1 : 4), class: "rowlab"}); lab.textContent = r.label; svg.append(hit, lab);
      if (r.sub) { const s = svgEl("text", {x: 12, y: cy + 12, class: "rowsub"}); s.textContent = r.sub; svg.append(s); }
      if (r.slo != null && r.shi != null) svg.append(svgEl("line", {x1: x(r.slo), x2: x(r.shi), y1: cy, y2: cy, stroke: "var(--muted)", "stroke-width": 1, "stroke-linecap": "round"}));
      if (r.lo != null && r.hi != null) svg.append(svgEl("line", {x1: x(r.lo), x2: x(r.hi), y1: cy, y2: cy, stroke: "var(--s1)", "stroke-width": 2, "stroke-linecap": "round"}));
      const excl = r.lo != null && (r.lo > 0 || r.hi < 0);
      if (r.est != null) svg.append(svgEl("circle", {cx: x(r.est), cy, r: r.emph ? 6 : 4.5, fill: excl ? "var(--s1)" : "var(--surface)", stroke: excl ? "var(--surface)" : "var(--s1)", "stroke-width": 2}));
      if (r.emph && r.est != null) svg.append(svgEl("circle", {cx: x(r.est), cy, r: 8.5, fill: "none", stroke: "var(--s1)", "stroke-width": 1}));
      hit.addEventListener("pointermove", ev => showTip(ev, r.tipLines)); hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); showTip({clientX: b.left + left, clientY: b.bottom}, r.tipLines); }); hit.addEventListener("blur", hideTip);
      y += rowH;
    });
  });
  const unit = svgEl("text", {x: (left + W - right) / 2, y: H - 6, "text-anchor": "middle", class: "tick"}); unit.textContent = opts.unit || ""; svg.append(unit);
  box.append(svg); return box;
}
function dotSvg(filled) { const s = svgEl("svg", {width: 14, height: 14}); s.append(svgEl("circle", {cx: 7, cy: 7, r: 4.5, fill: filled ? "var(--s1)" : "var(--surface)", stroke: filled ? "var(--surface)" : "var(--s1)", "stroke-width": 2})); return s; }
function lineSvg(c, w) { const s = svgEl("svg", {width: 22, height: 10}); s.append(svgEl("line", {x1: 2, x2: 20, y1: 5, y2: 5, stroke: c, "stroke-width": w, "stroke-linecap": "round"})); return s; }
function legend(simultaneous = true) {
  return el("div", {class: "legend"}, el("span", {}, dotSvg(true), "interval excludes 0"), el("span", {}, dotSvg(false), "interval includes 0"),
    el("span", {}, lineSvg("var(--s1)", 2), "95% interval"), simultaneous ? el("span", {}, lineSvg("var(--muted)", 1), "simultaneous 95% interval for the question") : null);
}
function toRow(r, scale, group, label, sub, emph) {
  const k = scale === "std" ? std(r) : 1;
  const f = v => (k != null && v != null ? v * k : null);
  const unitTxt = scale === "std" ? "SD" : OUT_UNITS[r.outcome] || "";
  return {group, label, sub, emph, est: f(r.estimate), lo: f(r.ci_low), hi: f(r.ci_high), slo: f(r.sim_low), shi: f(r.sim_high),
    tipLines: [["v", `${fmt(f(r.estimate), 3)} ${unitTxt}  [${fmt(f(r.ci_low), 3)}, ${fmt(f(r.ci_high), 3)}]`],
               ["l", `${r.contrast_label}: ${r.arm} vs ${r.reference}`], ["l", `${OUT[r.outcome] || r.outcome} · ${DEVNAME[r.device] || r.device}${r.device === "apple" && r.apple_source === "watch_only" ? " (watch only)" : ""} · ${r.cohort}`],
               ["m", `Original units: ${fmt(r.estimate, 3)} ${OUT_UNITS[r.outcome] || ""} (se ${fmt(r.se, 3)}), p ${fmtP(r.p)}`],
               ["m", `${(r.n_rows || 0).toLocaleString()} decisions, ${(r.n_participants || 0).toLocaleString()} participants; ${(r.n_arm || 0).toLocaleString()} received ${r.arm}`],
               ["m", `${r.estimator}${r.learner ? " (" + r.learner + ")" : ""} · ${r.config_name}`],
               ...(dateTxt(r) ? [["m", dateTxt(r)]] : []),
               ...(floorTxt(r) ? [["m", floorTxt(r)]] : [])]};
}
function table(rows, cols, open) {
  const t = el("table"); const hr = el("tr"); cols.forEach(c => hr.append(el("th", {class: c.num ? "num" : ""}, c.h))); t.append(el("thead", {}, hr));
  const tb = el("tbody"); rows.forEach(r => { const tr = el("tr"); cols.forEach(c => tr.append(el("td", {class: c.num ? "num" : ""}, c.f(r)))); tb.append(tr); }); t.append(tb);
  const d = el("details", {open: !!open}); d.append(el("summary", {}, "Table"), el("div", {class: "scroll"}, t)); return d;
}
const estCols = [
  {h: "Outcome", f: r => OUT[r.outcome] || r.outcome}, {h: "Contrast", f: r => r.contrast_label}, {h: "Arm", f: r => `${r.arm} vs ${r.reference}`},

async function submitRun(btn) {

                extra_moderators: (runForm.extra || []).join(",")};
  delete body.extra; delete body.modsTouched; delete body.modsCohort;
  const rng = (DATA.date_ranges || {})[String(body.cohort)];
  if (rng && body.date_from && body.date_from <= rng[0]) delete body.date_from;
  if (rng && body.date_to && body.date_to >= rng[1]) delete body.date_to;
  btn.disabled = true;
  try {
    const r = await fetch("/api/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    if (j.error) { alert(j.error); return; }
    state.cohort = +body.cohort; state.device = body.device; state.apple = body.apple_source;
    state.runMsg = `Queued “${j.label}”: ${j.runs} runs. It appears under Runs below.`;
    state.jobs = [j, ...state.jobs.filter(x => x.id !== j.id)];
    delete runForm.label;
    render(); wakeSync();
    document.getElementById("jobs-card")?.scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) { alert("The app did not answer; is it still running? " + e); }
  finally { btn.disabled = false; }
}
async function showJob(j, tab) {
  if (j.run_ids && j.run_ids.some(id => !E.some(r => r.run_id === id))) { try { await refreshData(); } catch (e) { /* show what is loaded */ } }
  state.cohort = +j.cohort; state.device = j.device; state.apple = j.apple_source || "watch_then_phone";
  if (tab === "who") {
    const r6 = E.find(r => j.run_ids.includes(r.run_id) && isWho(r));
    state.who = {analysis: r6 ? r6.config_name : j.label + " (Q6)"};
  } else state.ex = {runs: j.run_ids, runsLabel: j.label, term: "effect"};
  state.tab = tab; render(); window.scrollTo(0, 0);
}
function jobsCard() {
  const jc = el("div", {class: "card", id: "jobs-card"}, el("h2", {}, "Runs"), el("p", {class: "note"}, "Runs started while the app has been open. Results appear in every tab as soon as each run is stored."));
  if (!state.jobs.length) jc.append(el("div", {class: "empty"}, "No runs started in this session."));
  state.jobs.forEach(j => {
    const ready = j.kind !== "refresh" && (j.status === "done" || (j.stored || 0) > 0);
    const isStd = j.kind === "standard";
    const view = el("button", {class: "btn", type: "button", disabled: !ready}, isStd ? "Show answers" : "Show results");
    view.onclick = isStd ? () => { state.cohort = +j.cohort; state.device = "combined"; state.tab = "answers"; render(); window.scrollTo(0, 0); } : () => showJob(j, "explorer");
    const btns = el("div", {style: "display:flex; gap:8px"}, view);
    if (j.who) { const w = el("button", {class: "btn", type: "button", disabled: !ready}, "Who responds"); w.onclick = () => showJob(j, "who"); btns.append(w); }
    const where = isStd ? "" : j.cohort ? ` · ${j.cohort} · ${DEVNAME[j.device] || j.device}${j.device === "apple" && j.apple_source === "watch_only" ? " (watch only)" : ""}` : "";
    const prog = j.status === "running" ? ` · ${j.stored || 0} of ${j.runs} stored` : ` · ${j.runs} runs`;
    jc.append(el("div", {class: "job"}, el("div", {}, el("span", {class: "st " + j.status}, cap(j.status)), ` · ${j.label}${where}${prog}${j.seconds != null ? " · " + j.seconds + " s" : ""}`), btns,
      el("div", {class: "log"}, (j.log || []).slice(-4).join("\n"))));
  });
  return jc;
}
function savedCard() {
  const custom = [...new Set(E.filter(r => r.family !== "primary" && r.family !== "q6").map(r => r.config_name))].sort().reverse();
  const sc = el("div", {class: "card", id: "saved-card"}, el("h2", {}, "Saved analyses"), el("p", {class: "note"}, "Analyses run from this tab, newest first, kept in the results store. The primary specification and the standing question 6 runs are not listed."));
  if (!custom.length) sc.append(el("div", {class: "empty"}, "None yet."));
  custom.forEach(name => {
    const rows = E.filter(r => r.config_name === name), r0 = rows[0], who = rows.some(isWho);
    const ids = [...new Set(rows.map(r => r.run_id))];
    const show = el("button", {class: "btn", type: "button"}, who ? "Who responds" : "Show");
    show.onclick = () => showJob({run_ids: ids, label: name, cohort: r0.cohort, device: r0.device, apple_source: r0.apple_source}, who ? "who" : "explorer");
    const rm = el("button", {class: "btn", type: "button"}, "Remove"); rm.onclick = async () => {
      if (!confirm(`Remove the saved analysis "${name}"?`)) return;
      await fetch("/api/delete", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({config_name: name})});
      await refreshData(); render(); };
    const olderRun = (DATA.runs || []).some(r => r.config_name === name && r.older_data);
    sc.append(el("div", {class: "job"}, el("div", {}, el("span", {class: "st"}, name), ` · ${r0.cohort} · ${DEVNAME[r0.device] || r0.device}${r0.device === "apple" && r0.apple_source === "watch_only" ? " (watch only)" : ""}${dateTxt(r0) ? " · " + dateTxt(r0).replace("Decisions ", "") : ""} · ${rows.length} estimate${rows.length === 1 ? "" : "s"}${olderRun ? " · earlier data files" : ""}`), el("div", {style: "display:flex; gap:8px"}, show, rm)));
  });
  return sc;
}
// ---------- keeping the page in step with the results store ----------
// The page asks the app every few seconds (every 1.2 s while a run is queued or running) for its jobs and a stamp that
// changes whenever results are stored or removed, here or by `ihs-causal run` in a terminal; a new stamp reloads the
// results and redraws. A failed request is simply retried, so the page cannot stop listening.
let wake = null;
const wakeSync = () => { if (wake) wake(); };
async function refreshData() {
  state.loading = true; renderSub();
  try {
    const r = await fetch("/api/payload"); if (!r.ok) throw new Error("payload " + r.status);
    DATA = await r.json(); E = DATA.estimates;
  } finally { state.loading = false; renderSub(); }
}
function redraw(dataChanged) {
  if (state.tab === "setup") return;          // keep the folder being typed
  if (state.tab !== "run") { if (dataChanged) render(); return; }
  // on the Run tab, keep the form (and whatever is being typed) and replace the lists only
  document.getElementById("jobs-card")?.replaceWith(jobsCard());
  document.getElementById("standard-card")?.replaceWith(standardCard());
  if (dataChanged) { document.getElementById("saved-card")?.replaceWith(savedCard()); renderChrome(); }
}
async function syncOnce() {
  const r = await fetch("/api/jobs"); if (!r.ok) throw new Error("jobs " + r.status);
  const s = await r.json();
  const jobsChanged = JSON.stringify(s.jobs) !== JSON.stringify(state.jobs);
  state.jobs = s.jobs;
  let dataChanged = false;
  if (s.stamp !== DATA.results_stamp) { await refreshData(); dataChanged = true; }
  if (dataChanged || jobsChanged) redraw(dataChanged);
  return s.jobs.some(j => j.status === "queued" || j.status === "running");
}
async function syncLoop() {
  for (;;) {
    let active = false;
    try { active = await syncOnce(); } catch (e) { /* the app is busy or restarting: try again shortly */ }
    await new Promise(res => { wake = res; setTimeout(res, active ? 1200 : (document.hidden ? 15000 : 4000)); });
    wake = null;
  }
}

// ---------- Diagnostics ----------
function viewDiagnostics(main) {
  const d = DATA.diagnostics.filter(r => r.cohort == state.cohort && r.device === state.device && (state.device !== "apple" || (r.apple_source || "watch_then_phone") === state.apple));
  const card = el("div", {class: "card"}, el("h2", {}, `Samples and design checks · ${viewLabel()}`), el("p", {class: "note"}, "Rows lost at each step, the smallest randomization probability analysed, and, for DR-WCLS, how much of each arm's outcome the outcome model explains out of fold. 'No compared message possible' counts decisions where none of the compared messages could be sent, such as another domain's week in 2025; they are out of scope by design. 'Below probability floor' counts decisions removed because a compared arm was nearly impossible."));
  if (!d.length) card.append(el("div", {class: "empty"}, "Nothing run for this cohort and device yet."));
  else card.append(table(d, [
    {h: "Analysis", f: r => r.config_name}, {h: "Outcome", f: r => OUT[r.outcome] || r.outcome}, {h: "Contrast", f: r => r.contrast_label + (r.positivity === "pairwise" && (r.arms_compared || []).length === 2 ? ` · ${r.arms_compared[1]}` : "")},
    {h: "Candidate rows", num: 1, f: r => (r.rows_candidate || 0).toLocaleString()}, {h: "Outcome missing", num: 1, f: r => (r.rows_outcome_missing || 0).toLocaleString()},
    {h: "No compared message possible", num: 1, f: r => r.rows_no_message_possible == null ? "–" : r.rows_no_message_possible.toLocaleString()},
    {h: "Below probability floor", num: 1, f: r => (r.rows_dropped_low_probability || 0).toLocaleString()}, {h: "Analysed", num: 1, f: r => (r.rows_analysed || 0).toLocaleString()},
    {h: "Arms dropped", f: r => (r.arms_dropped_small || []).join(", ") || "–"}, {h: "Min p", num: 1, f: r => fmt(r.min_p_observed, 3)},
    {h: "Outcome model R² by arm", f: r => r.nuisance_r2_out_of_fold ? Object.entries(r.nuisance_r2_out_of_fold).map(([k, v]) => `${k} ${fmt(v, 2)}`).join("; ") : "–"}], true));
  main.append(card);
}

// ---------- About ----------
function viewAbout(main) {
  const d = DATA.defaults || {}, keep = d.keep || {}, win = d.window || {};
  const inputs = {}; DATA.runs.forEach(r => Object.entries(r.inputs || {}).forEach(([k, v]) => { inputs[`${r.cohort} ${k}`] = v; }));
  const li = (...items) => el("ul", {}, items.map(t => el("li", {}, t)));
  const p = el("div", {class: "card prose"});
  const folder = [];
  if (SERVE && SETUP().data_root) {
    const ch = el("button", {class: "btn", type: "button"}, "Change…");
    ch.onclick = () => { state.tab = "setup"; state.setupPath = undefined; state.setupResult = undefined; render(); };
    folder.push(el("h3", {}, "Data folder"), el("div", {class: "form-row", style: "justify-content:flex-start"}, el("code", {}, SETUP().data_root), ch));
  }
  p.append(el("h2", {}, "About these results"), ...folder,
    el("h3", {}, "What is estimated"),
    el("p", {}, "Causal excursion effects from the micro-randomized trials: the difference in the next day's outcome between receiving a message (or a kind of message) and not, at decisions where both were possible, averaged over participants and days. Randomization probabilities are known from the study design. The 2024 and 2025 cohorts are analysed separately and never pooled."),
    el("h3", {}, "The day after a decision"),
    el("p", {}, `Each decision's window runs from the message (or the time a message would have gone out) to the next day's decision. A window counts only if it is a day long: ${win.span_min ?? 20} to ${win.span_max ?? 28} hours. History covariates come from the previous day's window.`),
    el("p", {}, "The Run tab can restrict an analysis to a range of decision dates, for example to compare early and late months of the study year. History covariates still come from the day before the first date."),
    el("h3", {}, "Which days are kept"),
    el("p", {}, "A day is kept when there is evidence the device was measuring, never because the outcome itself was non-zero."),
    li(`Steps: an hour is observed when the device shows heart rate or a positive step count (Garmin writes zeros in every hour, so a zero is not evidence of wear); a blank step count in an observed hour is a real zero. A day is kept with at least ${keep.steps_min_observed_hours ?? 10} observed hours. People with only an iPhone have no heart-rate signal, so for them "observed" means "has steps", a weaker measure; device type stays in the outcome model.`,
       `Sleep: the unit is the night. A day is kept when a sleep record exists in it, and the outcome is minutes asleep. A night shorter than ${keep.sleep_short_night_minutes ?? 180} minutes is kept only if the device was observed for at least ${Math.round(100 * (keep.sleep_night_wear_min ?? 0.67))}% of the overnight hours (${keep.night_start_hour ?? 22}:00 to ${keep.night_end_hour ?? 7}:00 local time), so cut-off records are not read as short sleep. No sleep record means missing, not zero.`,
       "Mood: a day is kept when it holds a response; the outcome is the mean response. Response rates fall over the study year, which the Diagnostics tab shows by analysis."),
    el("h3", {}, "Devices"),
    li("Combined: each person contributes their main device, the one among Fitbit, Garmin and Apple with the most observed hours. Mood is kept for everyone, including people without a wearable.",
       "Apple, Garmin, Fitbit: that device for everyone who has it. Mood is restricted to the same people, so each device view describes one group of participants. A person with two devices appears in both views.",
       "Apple data: 'watch, else phone' uses the Apple Watch for each hour and the iPhone where the watch has nothing; 'watch only' uses the watch alone. The share of observed hours from the watch is part of the outcome model."),
    el("h3", {}, "Estimators"),
    el("p", {}, "DR-WCLS: an outcome model is fitted on other participants' data (5-fold cross-fitting by participant) and combined with the known probabilities in a doubly robust pseudo-outcome. WCLS is available for comparison. Standard errors are clustered by participant. Simultaneous intervals cover every effect within one question at once (multiplier bootstrap)."),
    el("h3", {}, "Low probabilities"),
    el("p", {}, `A decision is left out when a compared arm had a probability below ${d.min_prob ?? 0.001} at that decision: an effect cannot be estimated where the message was nearly impossible, and a tiny probability gives one decision a huge weight. Arms with fewer than ${d.min_arm_rows ?? 200} decisions are left out. In comparisons with several arms (strategies, message types) each arm is compared with no message on its own, and the floor checks only those two probabilities, so a decision where some other message was nearly impossible still counts. The Run tab can instead check every arm at once, as in Jack's notebook. This matters most in 2025: given a send, the agents chose a message type in proportion to its predicted benefit with no floor, and in sleep and step weeks the weights settled on one agent that made some types almost impossible. The Diagnostics tab shows how many decisions each rule removed.`),
    el("h3", {}, "Message types"),
    el("p", {}, "The nine message types are the strategies with and without the participant's own data. For 2025 their probabilities come from the agent. For 2024 they are rebuilt from the message pools, a uniform draw over core messages not yet delivered; summed over domains and over data display they reproduce the published probabilities exactly. Message types have their own simultaneous intervals, separate from the strategies."),
    el("h3", {}, "Who responds"),
    el("p", {}, "Moderation: the effect's change per standard deviation of each characteristic, with false-discovery-rate q-values. Variation between people: each person's study weeks are split alternately into two halves; because messages are randomized day by day, the agreement of the two halves across people measures how much true effects differ, tested with a sign-flip test."),
    el("h3", {}, "Data notes"),
    li(...Object.entries(DATA.notes || {}).map(([k, v]) => `${k}: ${v}`)),
    el("h3", {}, "Data versions"),
    el("p", {}, "Every stored analysis records the files it was made from. When a file is updated, analyses made from the earlier file are flagged at the top of the page, and the button there (or ihs-causal refresh) reruns them with the same settings on the current files."),
    Object.keys(DATA.current_inputs || {}).length
      ? table(Object.entries(DATA.current_inputs).flatMap(([c, v]) => Object.entries(v.inputs).map(([k, sha]) => ({c, k, sha, file: (v.files || {})[k] || "",
          n: DATA.runs.filter(r => String(r.cohort) === c && (r.inputs || {})[k] === sha).length}))),
          [{h: "Cohort", f: r => r.c}, {h: "Input", f: r => r.k}, {h: "File", f: r => r.file.split(/[\\/]/).slice(-2).join("/")}, {h: "SHA-256", f: r => r.sha.slice(0, 16) + "…"}, {h: "Analyses made from it", num: true, f: r => r.n.toLocaleString()}], true)
      : Object.keys(inputs).length ? table(Object.entries(inputs).map(([k, v]) => ({k, v})), [{h: "Input", f: r => r.k}, {h: "SHA-256", f: r => r.v.slice(0, 16) + "…"}]) : el("p", {}, "–"),
    el("p", {class: "sub"}, `Generated ${DATA.generated} by ihs-causal ${DATA.version}.`));
  main.append(p);
}

// ---------- shell ----------
const TABS = [["answers", "Answers", viewAnswers], ["explorer", "Explorer", viewExplorer], ["who", "Who responds", viewWho], ["robustness", "Robustness", viewRobustness], ["run", "Run", viewRun], ["diagnostics", "Diagnostics", viewDiagnostics], ["about", "About", viewAbout]];
function seg(label, choices, current, onPick) {
  return el("div", {class: "seg", role: "group", "aria-label": label}, choices.map(([v, l]) => { const b = el("button", {type: "button", "aria-pressed": String(current) === String(v)}, l); b.onclick = () => onPick(v); return b; }));
}
function olderNote(older) {
  const by = {}; older.forEach(r => { by[r.cohort] = (by[r.cohort] || 0) + 1; });
  const box = el("div", {class: "datanote"}, `${older.length.toLocaleString()} stored ${older.length === 1 ? "analysis was" : "analyses were"} made from earlier data files (${Object.entries(by).map(([c, n]) => `${c}: ${n.toLocaleString()}`).join(", ")}). Their results are still shown. `);
  if (SERVE) {
    const b = el("button", {class: "btn", type: "button"}, "Rerun them on the current files");
    b.onclick = async () => {
      b.disabled = true;
      const j = await (await fetch("/api/refresh", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"})).json();
      if (j.error) { alert(j.error); b.disabled = false; return; }
      state.tab = "run"; render(); wakeSync(); };
    box.append(b);
  } else box.append("Run ihs-causal refresh to redo them.");
  return box;
}
function render() {
  hideTip();
  renderChrome();
  const main = document.getElementById("main"); main.replaceChildren();
  (state.tab === "setup" ? viewSetup : TABS.find(t => t[0] === state.tab)[2])(main);
}
function renderChrome() {
  if (state.tab === "setup") { ["controls", "datanote", "tabs"].forEach(id => document.getElementById(id).replaceChildren()); renderSub(); return; }
  const controls = document.getElementById("controls");
  controls.replaceChildren(
    seg("Cohort", [[2025, "2025"], [2024, "2024"]], state.cohort, v => { state.cohort = +v; state.ex = {}; if (!runForm.cohort) { delete runForm.date_from; delete runForm.date_to; } render(); }),
    seg("Device", DEVICES, state.device, v => { state.device = v; state.ex = {}; render(); }),
    ...(state.device === "apple" ? [seg("Apple data", [["watch_then_phone", "Watch + phone"], ["watch_only", "Watch only"]], state.apple, v => { state.apple = v; render(); })] : []),
    (() => { const b = el("button", {class: "icon-btn", type: "button", "aria-label": "Switch light or dark theme"}, "Theme"); b.onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark"); }; return b; })());
  const note = (DATA.notes || {})[String(state.cohort)];
  const older = (DATA.runs || []).filter(r => r.older_data);
  document.getElementById("datanote").replaceChildren(...(note ? [el("div", {class: "datanote"}, `${state.cohort} data: ${note}`)] : []),
    ...(older.length ? [olderNote(older)] : []));
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, l]) => { const b = el("button", {role: "tab", type: "button", "aria-selected": state.tab === k}, l); b.onclick = () => { state.tab = k; render(); if (k === "run") wakeSync(); }; return b; }));
  renderSub();
}
function renderSub() {
  if (state.tab === "setup") { document.getElementById("sub").textContent = SETUP().needed ? "First start on this computer" : "Data folder"; return; }
  const n = E.filter(inView).length;
  document.getElementById("sub").textContent = `${n.toLocaleString()} estimates for ${viewLabel()} · ` +
    (SERVE ? (state.loading ? "loading new results…" : "live, updated " + DATA.generated.slice(11, 16)) : "generated " + DATA.generated);
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.tab !== "run" && state.tab !== "setup") render(); }, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) wakeSync(); });
render();
if (SERVE) syncLoop();
</script>
</body>
